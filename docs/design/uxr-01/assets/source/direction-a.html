<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>English Web — Direction A static design mockup</title>
  <style>
    :root {
      --paper: #f7f6f2;
      --paper-deep: #efeee9;
      --surface: #ffffff;
      --surface-soft: #fbfaf7;
      --ink: #172038;
      --muted: #667085;
      --faint: #8992a7;
      --line: #dfe2e8;
      --line-soft: #ececf0;
      --accent: #3f4c9b;
      --accent-strong: #2f3d86;
      --accent-soft: #e8eafa;
      --teal: #257a72;
      --teal-soft: #e0f0ed;
      --amber: #9a641b;
      --amber-soft: #f7edd7;
      --danger: #a23f4c;
      --danger-soft: #fae8eb;
      --shadow: 0 10px 24px rgba(26, 34, 55, .07);
      --radius: 14px;
      --font-body: "Segoe UI", ui-sans-serif, system-ui, sans-serif;
      --font-display: Cambria, "Times New Roman", serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-width: 320px; min-height: 100%; }
    body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.5; }
    body.dark {
      --paper: #161923; --paper-deep: #1d2230; --surface: #232837; --surface-soft: #1c2130;
      --ink: #f1f2f8; --muted: #b1b8c9; --faint: #8992a7; --line: #3b4254; --line-soft: #303748;
      --accent: #aeb8ff; --accent-strong: #c5ccff; --accent-soft: #303964; --teal: #69c2b7;
      --teal-soft: #233f42; --amber: #f2c77d; --amber-soft: #46351d; --danger: #f29aa4; --danger-soft: #482b34;
      --shadow: 0 14px 30px rgba(0, 0, 0, .28);
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .frame { min-height: 100vh; display: flex; }
    .sidebar { width: 238px; background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 24px 15px 18px; flex: 0 0 auto; }
    .brand { display: flex; align-items: center; gap: 11px; padding: 0 12px 23px; }
    .brand-mark { width: 31px; height: 31px; border: 1.5px solid var(--accent); border-radius: 10px; display: grid; place-items: center; color: var(--accent); background: var(--accent-soft); }
    .brand-mark svg { width: 17px; height: 17px; }
    .brand-name { font-family: var(--font-display); font-size: 18px; letter-spacing: -.02em; }
    .brand-sub { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .12em; margin-top: 2px; }
    .nav-group { margin: 0 0 19px; }
    .nav-label { padding: 0 12px 8px; color: var(--faint); text-transform: uppercase; font-size: 10px; letter-spacing: .11em; font-weight: 700; }
    .nav-item { display: flex; align-items: center; gap: 11px; min-height: 40px; padding: 8px 12px; border-radius: 10px; color: var(--muted); text-decoration: none; margin: 2px 0; }
    .nav-item svg { width: 16px; height: 16px; stroke-width: 1.7; }
    .nav-item.active { background: var(--accent-soft); color: var(--accent-strong); font-weight: 700; }
    .dark .nav-item.active { color: var(--accent-strong); }
    .side-note { margin-top: auto; padding: 15px 13px; border-top: 1px solid var(--line-soft); color: var(--muted); font-size: 12px; }
    .side-note strong { color: var(--ink); display: block; margin-bottom: 3px; font-size: 12px; }
    .main { min-width: 0; flex: 1; padding: 0 34px 40px; }
    .topbar { height: 70px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); gap: 18px; }
    .crumbs { color: var(--muted); font-size: 12px; display: flex; gap: 7px; align-items: center; }
    .crumbs strong { color: var(--ink); font-weight: 700; }
    .top-actions { display: flex; align-items: center; gap: 12px; }
    .status-link { display: inline-flex; align-items: center; gap: 7px; text-decoration: none; color: var(--muted); font-size: 12px; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--teal); }
    .avatar { width: 31px; height: 31px; border-radius: 50%; background: #d9d8ed; color: #31377a; display: grid; place-items: center; font-weight: 700; font-size: 12px; }
    .provenance { max-width: 1180px; margin: 21px auto 0; border: 1px dashed var(--line); color: var(--muted); background: var(--surface-soft); border-radius: 9px; padding: 7px 11px; font-size: 10px; letter-spacing: .04em; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .provenance strong { color: var(--accent); font-weight: 700; }
    .content { max-width: 1180px; margin: 0 auto; padding-top: 31px; }
    h1, h2, h3, p { margin: 0; }
    h1 { font-family: var(--font-display); font-size: clamp(28px, 3.3vw, 44px); line-height: 1.08; letter-spacing: -.035em; font-weight: 500; }
    h2 { font-family: var(--font-display); font-size: clamp(22px, 2.2vw, 30px); line-height: 1.14; letter-spacing: -.025em; font-weight: 500; }
    h3 { font-size: 15px; line-height: 1.25; }
    .lead { margin-top: 12px; color: var(--muted); max-width: 62ch; font-size: 15px; }
    .section-head { display: flex; justify-content: space-between; align-items: end; gap: 16px; margin-bottom: 16px; }
    .section-head p { color: var(--muted); font-size: 12px; margin-top: 5px; }
    .button { border: 1px solid transparent; border-radius: 9px; padding: 10px 15px; min-height: 42px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; }
    .button.primary { background: var(--accent); color: white; box-shadow: 0 5px 12px rgba(63, 76, 155, .2); }
    .button.secondary { background: var(--surface); border-color: var(--line); color: var(--ink); }
    .button.ghost { background: transparent; color: var(--accent-strong); border-color: transparent; padding-inline: 7px; }
    .button.small { min-height: 34px; padding: 7px 11px; font-size: 12px; }
    .tag { font-size: 11px; border-radius: 999px; padding: 4px 8px; display: inline-flex; gap: 5px; align-items: center; white-space: nowrap; font-weight: 700; }
    .tag.indigo { color: var(--accent-strong); background: var(--accent-soft); }
    .tag.teal { color: var(--teal); background: var(--teal-soft); }
    .tag.amber { color: var(--amber); background: var(--amber-soft); }
    .tag.danger { color: var(--danger); background: var(--danger-soft); }
    .grid { display: grid; gap: 18px; }
    .grid.two { grid-template-columns: minmax(0, 1.15fr) minmax(280px, .85fr); }
    .grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; }
    .card.soft { background: var(--surface-soft); }
    .card.elevated { box-shadow: var(--shadow); border-color: transparent; }
    .card-title { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; }
    .muted { color: var(--muted); }
    .faint { color: var(--faint); }
    .sp-26 { margin-top: 26px; }
    .sp-20 { margin-top: 20px; }
    .sp-16 { margin-top: 16px; }
    .metric { min-height: 111px; }
    .metric-label { color: var(--muted); font-size: 12px; }
    .metric-value { display: block; font-family: var(--font-display); font-size: 31px; line-height: 1; margin-top: 13px; }
    .metric-note { font-size: 11px; color: var(--muted); margin-top: 10px; }
    .metric-note.good { color: var(--teal); }
    .empty-hero { padding: 35px 36px 33px; display: flex; align-items: center; justify-content: space-between; gap: 28px; }
    .empty-copy { max-width: 55ch; }
    .empty-copy h2 { margin-bottom: 11px; }
    .empty-copy p { color: var(--muted); }
    .quiet-ornament { width: 110px; height: 110px; border-radius: 44% 56% 51% 49%; background: var(--accent-soft); display: grid; place-items: center; color: var(--accent); flex: 0 0 auto; }
    .quiet-ornament svg { width: 42px; height: 42px; stroke-width: 1.25; }
    .list { display: grid; gap: 0; }
    .list-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 0; border-top: 1px solid var(--line-soft); }
    .list-row:first-child { border-top: 0; padding-top: 2px; }
    .row-title { font-weight: 700; }
    .row-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .progress { height: 7px; border-radius: 999px; background: var(--paper-deep); overflow: hidden; }
    .progress i { display: block; height: 100%; border-radius: inherit; background: var(--accent); }
    .chart { height: 128px; display: flex; align-items: end; gap: 9px; padding-top: 11px; }
    .bar { flex: 1; background: var(--accent-soft); border-radius: 5px 5px 2px 2px; position: relative; min-height: 8px; }
    .bar.active { background: var(--accent); }
    .bar span { position: absolute; top: calc(100% + 6px); left: 50%; transform: translateX(-50%); font-size: 10px; color: var(--faint); }
    .search-bar { display: flex; gap: 10px; margin-top: 20px; }
    .input-wrap { position: relative; flex: 1; }
    .input-wrap svg { position: absolute; width: 17px; left: 13px; top: 13px; color: var(--faint); }
    input { width: 100%; min-height: 44px; border: 1px solid var(--line); border-radius: 9px; padding: 9px 12px 9px 40px; background: var(--surface); color: var(--ink); outline: none; }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .lookup-layout { display: grid; grid-template-columns: 285px minmax(0, 1fr); gap: 18px; margin-top: 24px; }
    .result-list { padding: 8px 0; }
    .result { display: block; padding: 12px 13px; border-radius: 9px; color: inherit; text-decoration: none; }
    .result + .result { margin-top: 3px; }
    .result.active { background: var(--accent-soft); }
    .result-word { font-family: var(--font-display); font-size: 18px; }
    .result-meta { color: var(--muted); font-size: 11px; margin-top: 3px; }
    .detail-header { display: flex; align-items: start; justify-content: space-between; gap: 20px; }
    .word { font-family: var(--font-display); font-size: 42px; line-height: 1; letter-spacing: -.04em; }
    .ipa { color: var(--muted); font-size: 13px; margin: 8px 0 0; }
    .word-meaning { font-size: 18px; margin-top: 23px; }
    .source-line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .rule { border: 0; border-top: 1px solid var(--line-soft); margin: 22px 0; }
    .example { font-family: var(--font-display); font-size: 19px; line-height: 1.35; max-width: 58ch; }
    .example em { color: var(--accent-strong); font-style: normal; }
    .preview { border: 1px solid var(--line); border-radius: 11px; padding: 15px; background: var(--surface-soft); }
    .preview-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 7px; }
    .preview p { color: var(--muted); font-size: 12px; }
    .flash-wrap { max-width: 770px; margin: 0 auto; }
    .review-top { display: flex; justify-content: space-between; align-items: center; gap: 18px; }
    .review-count { color: var(--muted); font-size: 12px; }
    .flashcard { min-height: 344px; display: grid; place-items: center; text-align: center; padding: 40px; margin-top: 20px; }
    .flashcard .word { font-size: clamp(45px, 8vw, 74px); }
    .flashcard .hint { color: var(--muted); margin-top: 12px; }
    .answer { max-width: 570px; margin: 23px auto 0; text-align: left; border-top: 1px solid var(--line-soft); padding-top: 19px; }
    .ratings { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; margin-top: 16px; }
    .rating { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 9px; padding: 10px 8px; text-align: center; min-height: 52px; }
    .rating strong { display: block; font-size: 12px; }
    .rating span { display: block; font-size: 10px; color: var(--muted); margin-top: 2px; }
    .quiz-layout { display: grid; grid-template-columns: minmax(0, 1fr) 265px; gap: 18px; align-items: start; }
    .quiz-progress { display: flex; align-items: center; gap: 10px; margin-bottom: 19px; }
    .quiz-progress .progress { flex: 1; }
    .question { font-family: var(--font-display); font-size: clamp(24px, 3vw, 34px); line-height: 1.2; max-width: 28ch; }
    .choices { display: grid; gap: 10px; margin-top: 25px; }
    .choice { background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 13px 15px; text-align: left; color: var(--ink); display: flex; gap: 11px; align-items: start; }
    .choice.selected { border-color: var(--accent); background: var(--accent-soft); }
    .choice-letter { width: 22px; height: 22px; border: 1px solid var(--line); border-radius: 6px; display: grid; place-items: center; font-size: 11px; font-weight: 700; flex: 0 0 auto; }
    .choice.selected .choice-letter { border-color: var(--accent); color: var(--accent-strong); }
    .quiz-side { display: grid; gap: 13px; }
    .side-stat { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; padding: 9px 0; border-bottom: 1px solid var(--line-soft); }
    .side-stat:last-child { border-bottom: 0; padding-bottom: 0; }
    .status-layout { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(280px, .9fr); gap: 18px; }
    .status-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 15px; padding: 16px 0; border-top: 1px solid var(--line-soft); }
    .status-row:first-child { padding-top: 3px; border-top: 0; }
    .status-name { font-weight: 700; }
    .status-copy { color: var(--muted); font-size: 12px; margin-top: 3px; }
    .consent-card { background: var(--accent-soft); border-color: transparent; }
    .consent-card h3 { font-size: 18px; font-family: var(--font-display); font-weight: 500; }
    .consent-card p { margin-top: 10px; color: var(--muted); font-size: 12px; }
    .consent-list { margin: 16px 0 20px; display: grid; gap: 10px; }
    .consent-list li { display: flex; gap: 9px; align-items: start; color: var(--muted); font-size: 12px; }
    .consent-list svg { width: 15px; height: 15px; color: var(--accent-strong); flex: 0 0 auto; margin-top: 2px; }
    .notice { display: flex; align-items: start; gap: 10px; border-radius: 10px; padding: 12px 13px; font-size: 12px; }
    .notice svg { width: 16px; height: 16px; flex: 0 0 auto; margin-top: 1px; }
    .notice.warn { color: var(--amber); background: var(--amber-soft); }
    .notice.error { color: var(--danger); background: var(--danger-soft); }
    .notice.info { color: var(--accent-strong); background: var(--accent-soft); }
    .mobile-header, .bottom-nav { display: none; }
    .wide-only { display: inline; }
    .footer-note { color: var(--faint); font-size: 10px; margin-top: 24px; }
    @media (max-width: 1050px) {
      .main { padding-inline: 24px; }
      .sidebar { width: 215px; }
      .grid.three { gap: 12px; }
      .card { padding: 18px; }
    }
    @media (max-width: 740px) {
      .frame { display: block; }
      .sidebar { display: none; }
      .main { padding: 0 15px 82px; }
      .topbar { display: none; }
      .mobile-header { display: flex; min-height: 61px; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); }
      .mobile-brand { display: flex; align-items: center; gap: 9px; font-family: var(--font-display); font-size: 17px; }
      .menu-btn { border: 1px solid var(--line); border-radius: 9px; width: 37px; height: 37px; background: var(--surface); color: var(--ink); display: grid; place-items: center; }
      .menu-btn svg { width: 17px; }
      .provenance { margin-top: 12px; font-size: 9px; align-items: start; }
      .provenance span:last-child { display: none; }
      .content { padding-top: 24px; }
      h1 { font-size: 32px; }
      h2 { font-size: 25px; }
      .lead { font-size: 14px; }
      .section-head { align-items: start; flex-direction: column; gap: 9px; }
      .grid.two, .grid.three, .lookup-layout, .quiz-layout, .status-layout { grid-template-columns: 1fr; }
      .empty-hero { padding: 24px; display: block; }
      .quiet-ornament { display: none; }
      .empty-hero .button { margin-top: 20px; width: 100%; }
      .grid.three { gap: 10px; }
      .metric { min-height: 94px; }
      .metric-value { margin-top: 8px; font-size: 27px; }
      .search-bar { display: block; }
      .search-bar .button { margin-top: 9px; width: 100%; }
      .lookup-layout { margin-top: 14px; }
      .lookup-layout > .card:first-child { padding: 12px; }
      .detail-header { display: block; }
      .detail-header .button { margin-top: 15px; width: 100%; }
      .word { font-size: 39px; }
      .flashcard { min-height: 270px; padding: 25px 16px; }
      .ratings { gap: 6px; }
      .rating { padding-inline: 4px; }
      .quiz-side { order: -1; grid-template-columns: repeat(3, 1fr); gap: 7px; }
      .quiz-side .card { padding: 12px; }
      .quiz-side .card-title, .quiz-side p { font-size: 11px; }
      .question { font-size: 25px; }
      .choice { min-height: 52px; }
      .status-row { padding: 14px 0; }
      .bottom-nav { position: fixed; z-index: 5; bottom: 0; left: 0; right: 0; display: grid; grid-template-columns: repeat(4, 1fr); min-height: 63px; border-top: 1px solid var(--line); background: color-mix(in srgb, var(--surface) 93%, transparent); backdrop-filter: blur(8px); }
      .bottom-nav a { color: var(--muted); text-decoration: none; display: grid; place-items: center; align-content: center; gap: 3px; font-size: 10px; }
      .bottom-nav a.active { color: var(--accent-strong); font-weight: 700; }
      .bottom-nav svg { width: 17px; height: 17px; }
      .footer-note { margin-bottom: 12px; }
    }
    @media (max-width: 345px) {
      .main { padding-inline: 11px; }
      .provenance { padding-inline: 8px; }
      .card { padding: 15px; }
      h1 { font-size: 29px; }
      .ratings { grid-template-columns: repeat(2, 1fr); }
      .quiz-side { grid-template-columns: 1fr; }
      .quiz-side .card { min-height: 0; }
    }
  
    svg { width:18px; height:18px; flex-shrink:0; }
    .button svg { width:16px; height:16px; }
    .button { min-height:44px; white-space:normal; }
    .dark .button.primary { color:#172038; }
    .avatar { display:none; }
    .metric { min-height:0; }
    .metric-note { font-size:12px; }
    .content { padding-top:24px; }
    .section-head h1 { font-size:36px; }
    .ratings { grid-template-columns:repeat(2,1fr); }
    .rating { min-height:52px; }
    .rating strong { font-size:14px; }
    .rating span { font-size:12px; }
    .tag { white-space:normal; }
    .content p,.content li { overflow-wrap:anywhere; }
    textarea { width:100%; border:1px solid var(--line); border-radius:8px; padding:12px; font:inherit; background:var(--surface); color:var(--ink); min-height:100px; }
    details { padding:12px 0; border-top:1px solid var(--line); }
    summary { cursor:pointer; font-weight:600; min-height:32px; }
    label { display:block; font-weight:600; margin-bottom:6px; }
    .edit-fields { display:grid; gap:16px; }
    .edit-fields input { padding-left:12px; }
    .quiz-side { position:sticky; top:24px; }
    .question { font-size:27px; max-width:100%; }
    .consent-list { padding:0; list-style:none; }
    @media(max-width:740px) {
      .section-head h1 { font-size:29px; }
      .grid.three { grid-template-columns:repeat(2,minmax(0,1fr)); }
      .grid.three .metric { padding:14px; }
      .metric-value { font-size:25px; }
      .lookup-layout { display:flex; flex-direction:column; }
      .lookup-layout>article { order:-1; }
      .quiz-side { order:0; position:static; grid-template-columns:1fr; }
      .flashcard { min-height:0; padding:24px 16px; }
      .status-layout>aside { order:-1; }
      .provenance { font-size:10px; }
    }
    @media(max-width:345px) { h1,.section-head h1 { font-size:26px; } .word { font-size:34px; } }
  
    .notice.error { display:block; }
    .notice.error p { margin:8px 0; }
    .notice.error .button { margin-top:8px; }
    .score-controls { display:flex; gap:8px; }
    .score-controls button { min-width:44px;min-height:44px;background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:6px; }
    .score-controls button.selected { background:var(--accent-soft);border-color:var(--accent); }
    :focus-visible { outline:3px solid var(--accent);outline-offset:3px; }
    button:disabled { opacity:.6;cursor:default; }
    .scrim { position:fixed;inset:0;background:#17203880;z-index:10; }
    .drawer { position:absolute;inset:0 auto 0 0;width:min(92%,360px);background:var(--surface);padding:20px;overflow:auto;color:var(--ink); }
    .drawer-title { display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px; }
    .drawer-title button { width:44px;height:44px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:24px; }
    .drawer h3 { margin:20px 0 6px;color:var(--muted);font-size:13px; }
    .drawer a { display:block;min-height:44px;padding:10px 8px;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line);font-size:14px; }
    .drawer p { font-size:12px;line-height:1.5;margin:8px 0; }
    .drawer-note { color:var(--muted); }
    .review-top { flex-wrap:wrap; }
    @media(min-width:741px) and (max-width:900px) { .sidebar { display:none; } .mobile-header { display:flex;min-height:54px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line); } .mobile-brand { display:flex;gap:9px;align-items:center; } .menu-btn { min-width:44px;min-height:44px;background:var(--surface);border:1px solid var(--line);color:var(--ink); } .topbar { display:none; } }

      <section class="card soft sp-20"><details><summary>Chẩn đoán: dữ liệu, nguồn Markdown, AI Bridge</summary><p>Mã trạng thái, request ID và thông tin kỹ thuật chỉ hiển thị trong mục này.</p></details><details><summary>Cảnh báo hiện tại và điều kiện kích hoạt</summary><p>API không phản hồi: trạng thái UNKNOWN. Mức nghiêm trọng khi kích hoạt không có nghĩa cảnh báo đang hoạt động.</p></details><details><summary>Runbooks & khả năng ngoại tuyến</summary><p>Không ghi nội dung học hoặc khóa vào thông tin chẩn đoán.</p></details></section>`);
    const edit = () => shell('lookup','Chỉnh sửa từ',`<section class="section-head"><div><h1>Chỉnh sửa meticulous</h1><p>Nguồn VALID · bản nháp được giữ</p></div><span class="tag indigo">Revision conflict</span></section><div class="notice warn">${icons.alert}<div><strong>Nguồn đã thay đổi.</strong><br>Revision yêu cầu 2; hiện tại 3. Không ghi đè. Đọc lại và xác nhận lưu mới.</div></div><section class="card sp-20"><div class="edit-fields"><div><label>Nghĩa tiếng Anh</label><textarea>Very careful and precise about details.</textarea></div><div><label>Nghĩa tiếng Việt</label><textarea>Cẩn thận, tỉ mỉ và chú ý đến từng chi tiết khi kiểm tra nguồn và ghi chép kết quả nghiên cứu.</textarea></div><div><label>Ví dụ tiếng Anh</label><textarea>She kept meticulous notes while comparing the two editions.</textarea></div></div><button class="button primary sp-16">Đọc lại nguồn</button><button class="button secondary sp-16">Giữ bản nháp</button><details class="sp-16"><summary>Chi tiết nguồn / ETag</summary><p>ETag được đọc từ backend; không dùng nhãn giả làm precondition.</p></details></section>`);
    const results = () => shell('quiz','Kết quả',`<section class="section-head"><div><h1>Hiểu kết quả, chọn bước tiếp theo.</h1><p>SUBMITTED · dữ liệu minh họa</p></div><button class="button primary">Ôn tập</button></section><section class="grid three sp-20">${metric('MCQ khách quan','1 / 2','1 đúng / 2 trả lời · 50%')}${metric('Cloze khách quan','1 / 1','Tổng 2 câu · 1 bỏ trống · 100%')}${metric('Writing tự chấm','3 / 4','1 câu · người học chọn')}</section><article class="card sp-20"><h3>Câu Writing đã nộp · không chỉnh sửa</h3><p class="example sp-16">The meticulous researcher checked every source before drawing a conclusion.</p><p class="muted sp-16">Tự chấm 3/4 không bị AI thay đổi.</p><details><summary>MCQ / Cloze: câu trả lời và giải thích</summary><p>Đáp án và giải thích chỉ xuất hiện sau khi nộp. Bỏ trống phân biệt với sai.</p></details></article><article class="card soft sp-20"><h3>Nhận xét AI tùy chọn</h3><span class="tag amber sp-16">Chưa yêu cầu · cần quyền AI</span><p class="sp-16">Nhận xét về dùng từ, ngữ pháp và độ rõ ràng; không phải điểm khách quan và không thay tự chấm.</p><button class="button secondary sp-16">Xem quyền AI</button><details class="sp-16"><summary>Lịch sử nhận xét</summary><p>REQUESTED, VALIDATED hoặc FAILED được giữ riêng. Đây là concept SOURCE_BACKED, hiện trạng G7 NOT_VERIFIED.</p></details></article>`);
    const preview = () => shell('lookup','Tra cứu AI',`<section class="section-head"><div><h1>Từ mới, trong ngữ cảnh.</h1><p>Bản xem trước SYNTHETIC · chưa lưu</p></div><span class="tag amber">AI tùy chọn</span></section><label>Từ tiếng Anh</label><div class="search-bar"><div class="input-wrap">${icons.search}<input value="meticulous"></div><button class="button secondary">Tra cứu AI</button></div><article class="card sp-20"><div class="detail-header"><div><div class="word">meticulous</div><div class="ipa">/məˈtɪk.jə.ləs/ · adjective</div></div><span class="tag amber">PREVIEW · Chưa lưu</span></div><p class="word-meaning">Very careful and precise about details.</p><p class="sp-16">Tỉ mỉ, chú ý kỹ đến từng chi tiết.</p><p class="example sp-16">She kept meticulous notes of each experiment.</p><div class="source-line"><span class="tag amber">Cambridge · UNVERIFIED</span><span>Không tự nâng cấp xác minh</span></div><details class="sp-16"><summary>Dạng từ và thông tin nguồn</summary><p>meticulously · meticulousness · toàn bộ dạng từ được lưu cùng nhau.</p></details><label class="sp-16">Ngày học</label><input type="date" value="2026-10-12"><p class="muted sp-16">Nguồn ngày đã đọc: chưa có nguồn. Lưu mới dùng precondition xác nhận không tồn tại.</p><button class="button primary sp-16">Lưu tất cả dạng từ để ôn</button><p class="metric-note">Chỉ hiển thị đã lưu khi backend xác nhận biên nhận.</p></article>`);
    const page = scenario === 'dashboard-first-run' ? dashboardFirst() : scenario === 'dashboard-populated' ? dashboardPopulated() : scenario === 'lookup-search-detail' ? lookup() : scenario === 'review' ? review() : scenario === 'quiz' ? quiz() : scenario === 'status-consent' ? status() : scenario === 'status-error' ? status(true) : scenario === 'edit-conflict' ? edit() : scenario === 'results' ? results() : scenario === 'lookup-preview' ? preview() : scenario === 'navigation-drawer' ? dashboardPopulated() : scenario === 'quiz-unknown' ? quiz() : scenario === 'review-unknown' ? review() : dashboardPopulated();
    document.getElementById('app').innerHTML = page;
    if (scenario === 'status-error') {
      const errorBox=document.querySelector('.notice.error');
      document.querySelector('.content').insertBefore(errorBox,document.querySelector('.status-layout'));
    }
    if (scenario === 'quiz-unknown') {
      document.querySelector('.content').insertAdjacentHTML('afterbegin','<div class="notice error"><div><strong>Chưa xác nhận lưu · UNKNOWN</strong><p>Giữ câu trả lời và thao tác hiện tại. Kiểm tra cùng thao tác trước khi nộp.</p><button class="button secondary">Kiểm tra kết quả lưu</button></div></div>');
      document.querySelector('.section-head .tag').textContent='Chưa xác nhận bản nháp';
      document.querySelector('.section-head .tag').className='tag amber';
      document.querySelector('.quiz-side .button.primary').disabled=true;
    }
    if (scenario === 'review-unknown') {
      document.querySelector('.flash-wrap').insertAdjacentHTML('afterbegin','<div class="notice warn"><div><strong>Chưa xác nhận đánh giá · UNKNOWN</strong><p>Giữ thẻ hiện tại. Kiểm tra cùng thao tác; chưa gửi đánh giá mới.</p><button class="button secondary">Kiểm tra kết quả</button></div></div>');
      document.querySelectorAll('.rating').forEach(b=>b.disabled=true);
    }
    if (scenario === 'navigation-drawer') {
      document.body.insertAdjacentHTML('beforeend','<div class="scrim"><section class="drawer" role="dialog" aria-modal="true" aria-label="Điều hướng"><div class="drawer-title"><strong>English Web · Điều hướng</strong><button aria-label="Đóng điều hướng">×</button></div><h3>Học tập</h3><a href="#">Tổng quan · /</a><a href="#">Ôn tập · /review</a><h3>Từ vựng</h3><a href="#">Tra cứu AI · /lookup</a><a href="#">Kho từ · /search</a><p>Chi tiết từ mở từ Kho từ · /word-forms/:id</p><h3>Luyện tập</h3><a href="#">Tạo bài kiểm tra · /quiz/new</a><p>Bài làm và kết quả mở theo attempt ID.</p><h3>Hệ thống</h3><a href="#">Trạng thái · /status</a><a href="#">Quyền gửi dữ liệu AI · /status#ai-consent</a><p class="drawer-note">MOCKUP: Escape đóng, focus trở về nút Menu là yêu cầu thiết kế; chưa kiểm chứng hành vi.</p></section></div>');
    }
    
  </script>
</body>
</html>
