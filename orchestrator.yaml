{
  "schema_version": 1,
  "base_branch": "main",
  "paths": {
    "run_dir": ".agent-runs",
    "worktree_root": "../english_web-worktrees"
  },
  "roles": {
    "prompt_engineer": {
      "provider": "codex",
      "executable": "codex",
      "model": null,
      "reasoning": "high"
    },
    "worker": {
      "provider": "agy",
      "executable": "agy",
      "model": "gemini-3.8-flash-high",
      "reasoning": "high",
      "worker_access": "workspace-write",
      "allow_process": false
    },
    "auditor": {
      "provider": "codex",
      "executable": "codex",
      "model": null,
      "reasoning": "high"
    },
    "integrator": {
      "provider": "codex",
      "executable": "codex",
      "model": null,
      "reasoning": "high"
    }
  },
  "max_fix_cycles": 3,
  "timeout_seconds": null,
  "verification": [
    [
      "npm",
      "run",
      "check:task:portable"
    ],
    [
      "python",
      "-m",
      "ruff",
      "check",
      "."
    ],
    [
      "python",
      "-m",
      "mypy",
      "backend",
      "tools/orchestrator"
    ]
  ],
  "integrate": false,
  "setup_commands": [
    [
      "npm",
      "ci"
    ]
  ]
}
