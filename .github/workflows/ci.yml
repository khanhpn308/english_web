name: Core CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

jobs:
  verify:
    name: Build, Tests and Gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      QUALITY_BASE_REF: origin/main
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked application and test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.lock
          npm ci --no-audit --no-fund
      - name: Install pinned security scanners with verified checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"

          curl --fail --location --retry 3 --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            --output "$RUNNER_TEMP/bin/gitleaks.tar.gz"
          (cd "$RUNNER_TEMP/bin" && printf '%s  %s\n' \
            "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb" \
            "gitleaks.tar.gz" | sha256sum --check --status)
          tar -xzf "$RUNNER_TEMP/bin/gitleaks.tar.gz" -C "$RUNNER_TEMP/bin" gitleaks
          chmod +x "$RUNNER_TEMP/bin/gitleaks"

          curl --fail --location --retry 3 --silent --show-error \
            "https://github.com/google/osv-scanner/releases/download/v2.6.0/osv-scanner_linux_amd64" \
            --output "$RUNNER_TEMP/bin/osv-scanner"
          (cd "$RUNNER_TEMP/bin" && printf '%s  %s\n' \
            "ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108" \
            "osv-scanner" | sha256sum --check --status)
          chmod +x "$RUNNER_TEMP/bin/osv-scanner"

          python -m venv "$RUNNER_TEMP/semgrep-venv"
          "$RUNNER_TEMP/semgrep-venv/bin/python" -m pip install \
            --disable-pip-version-check "semgrep==1.178.0"

          echo "GITLEAKS_BIN=$RUNNER_TEMP/bin/gitleaks" >> "$GITHUB_ENV"
          echo "OSV_SCANNER_BIN=$RUNNER_TEMP/bin/osv-scanner" >> "$GITHUB_ENV"
          echo "SEMGREP_BIN=$RUNNER_TEMP/semgrep-venv/bin/semgrep" >> "$GITHUB_ENV"
      - name: API contract tests
        run: npm run test:contract
      - name: Core CI gates (lint, types, tests, security, architecture, coverage)
        run: npm run check:task:portable
      - name: Frontend build
        run: npm run build
      - name: Publish verification artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-ci-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .agent/runs/logs/**
            coverage.xml
            htmlcov/frontend/lcov.info
            htmlcov/security/*.json
          if-no-files-found: warn
          retention-days: 14
