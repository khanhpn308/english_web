name: T089 host verification

# Only the GitHub runner executes tests. AI Workers only edit source code.
# Until this workflow is merged into the default branch, request the full suite
# by pushing a tag named ci-full/t089-* or creating a ci-full/t089-* branch.
# workflow_dispatch becomes available
# from Actions after the workflow also exists on the default branch.
on:
  push:
    branches:
      - feature/t089-r3-final-remediation
      - "ci-full/t089-*"
    tags:
      - "ci-full/t089-*"
  workflow_dispatch:
    inputs:
      suite:
        description: "Host verification suite"
        required: true
        type: choice
        default: full
        options:
          - fast
          - full

permissions:
  contents: read

concurrency:
  group: t089-host-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

jobs:
  fast:
    name: Fast host checks
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/feature/t089-r3-final-remediation') ||
      (github.event_name == 'workflow_dispatch' && inputs.suite == 'fast')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      QUALITY_BASE_REF: origin/main
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.lock
          npm ci --no-audit --no-fund
      - name: Existing repository fast gates
        run: npm run check:fast:active
      - name: Python type checking
        run: python -m mypy tools/orchestrator tests/orchestrator
      - name: Host-only boundary regression smoke tests
        run: |
          python -m pytest -q --no-cov \
            tests/orchestrator/test_core.py \
            tests/orchestrator/test_workflow.py \
            -k "cliprovider_rejects_unsafe_worker_before_any_command or explicit_host_verification_is_deferred_until_requested or explicit_host_verification_stops_before_automatic_fix"

  full:
    name: Full portable host gate
    if: >-
      (github.event_name == 'push' &&
        (startsWith(github.ref, 'refs/tags/ci-full/t089-') ||
         startsWith(github.ref, 'refs/heads/ci-full/t089-'))) ||
      (github.event_name == 'workflow_dispatch' && inputs.suite == 'full')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      QUALITY_BASE_REF: origin/main
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked application and test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.lock
          npm ci --no-audit --no-fund
      - name: Install Playwright Chromium for frontend browser tests
        run: npx playwright install --with-deps chromium
      - name: Install pinned security scanners with verified checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/t089-bin"
          curl --fail --location --retry 3 --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            --output "$RUNNER_TEMP/t089-bin/gitleaks.tar.gz"
          (cd "$RUNNER_TEMP/t089-bin" && printf '%s  %s\n' \
            "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb" \
            "gitleaks.tar.gz" | sha256sum --check --status)
          tar -xzf "$RUNNER_TEMP/t089-bin/gitleaks.tar.gz" -C "$RUNNER_TEMP/t089-bin" gitleaks
          chmod +x "$RUNNER_TEMP/t089-bin/gitleaks"

          curl --fail --location --retry 3 --silent --show-error \
            "https://github.com/google/osv-scanner/releases/download/v2.6.0/osv-scanner_linux_amd64" \
            --output "$RUNNER_TEMP/t089-bin/osv-scanner"
          (cd "$RUNNER_TEMP/t089-bin" && printf '%s  %s\n' \
            "ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108" \
            "osv-scanner" | sha256sum --check --status)
          chmod +x "$RUNNER_TEMP/t089-bin/osv-scanner"

          python -m venv "$RUNNER_TEMP/t089-semgrep-venv"
          "$RUNNER_TEMP/t089-semgrep-venv/bin/python" -m pip install \
            --disable-pip-version-check "semgrep==1.178.0"

          echo "GITLEAKS_BIN=$RUNNER_TEMP/t089-bin/gitleaks" >> "$GITHUB_ENV"
          echo "OSV_SCANNER_BIN=$RUNNER_TEMP/t089-bin/osv-scanner" >> "$GITHUB_ENV"
          echo "SEMGREP_BIN=$RUNNER_TEMP/t089-semgrep-venv/bin/semgrep" >> "$GITHUB_ENV"
      - name: Repository full portable gate (all eight checks)
        run: npm run check:task:portable
      - name: Publish verification logs (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t089-host-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .agent/runs/logs/**
            coverage.xml
            htmlcov/frontend/lcov.info
            htmlcov/security/*.json
          if-no-files-found: warn
          retention-days: 14
