[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vocabulary-app"
version = "0.1.0"
description = "Single-user local-first academic vocabulary learning application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.10.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "import-linter==2.15",
    "diff-cover>=10.4.1",
    "pip-tools>=7.4.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend"]
exclude = [
    ".venv",
    "node_modules",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
files = ["backend", "scripts/check_constraints.py", "tools/orchestrator"]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "scripts/tests", "tests/orchestrator"]
pythonpath = ["."]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--cov=.",
    "--cov-report=term-missing",
    "--cov-report=xml:coverage.xml",
]

[tool.coverage.run]
branch = true
relative_files = true
source = ["."]
omit = [
    "backend/tests/*",
    "scripts/tests/*",
    "tests/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 0

[tool.coverage.xml]
output = "coverage.xml"

[tool.vocabulary_quality]
changed_coverage_min = 80.0
total_coverage_baseline = 86.70
total_coverage_tolerance = 0.5
coverage_reports = ["coverage.xml", "htmlcov/frontend/lcov.info"]
coverage_source_prefixes = ["backend/", "frontend/src/", "scripts/", "tools/orchestrator/"]

# T062: https://import-linter.readthedocs.io/en/stable/get_started/configure/
# Analyze the actual namespace root directly. Scanning its regular parent (backend)
# omits namespace descendants in Grimp; no __init__.py changes are needed.
[tool.importlinter]
root_package = "backend.app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Application cannot depend on HTTP or composition"
type = "forbidden"
source_modules = ["backend.app.application"]
forbidden_modules = ["backend.app.http", "backend.app.main"]

[[tool.importlinter.contracts]]
name = "Platform remains a leaf abstraction"
type = "forbidden"
source_modules = ["backend.app.platform"]
forbidden_modules = [
    "backend.app.application", "backend.app.http", "backend.app.adapters",
    "backend.app.persistence", "backend.app.main",
]

[[tool.importlinter.contracts]]
name = "Concrete implementations cannot orchestrate"
type = "forbidden"
source_modules = ["backend.app.adapters", "backend.app.persistence"]
forbidden_modules = ["backend.app.application", "backend.app.http", "backend.app.main"]

[[tool.importlinter.contracts]]
name = "Concrete adapters are independent"
type = "independence"
modules = ["backend.app.adapters.*", "backend.app.persistence"]

[[tool.importlinter.contracts]]
name = "HTTP uses application and platform contracts"
type = "forbidden"
source_modules = ["backend.app.http"]
forbidden_modules = ["backend.app.adapters", "backend.app.persistence"]
# HTTP -> application -> adapter is permitted; direct concrete imports are not.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Backend cannot import frontend"
type = "forbidden"
source_modules = ["backend.app"]
forbidden_modules = ["frontend"]

[[tool.importlinter.contracts]]
name = "Backend ownership is acyclic"
type = "acyclic_siblings"
ancestors = ["backend.app"]
depth = 10
